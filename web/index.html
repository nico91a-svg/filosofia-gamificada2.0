<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        // Evita el parpadeo claro->oscuro al recargar: el tema por defecto es
        // claro (ver :root en src/index.css), esto solo adelanta la eleccion
        // guardada si el usuario paso a oscuro con ThemeToggle.jsx.
        try {
            if (localStorage.getItem('filosofo_theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) { /* localStorage no disponible: queda el tema claro por defecto */ }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1c1538">
    <meta name="description" content="Filósofo en Formación: sistema gamificado para clases de Filosofía.">
    <meta name="author" content="Nicolás Aldunate Gaete">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Filósofo en Formación</title>
    <style>
        /* Pantalla de arranque: visible hasta que carga la aplicacion. */
        body { margin: 0; background: #020617; }
        #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e1b4b, #3b0764, #020617); color: #fff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
        #boot .mark { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 16px;
            background: linear-gradient(135deg, #d946ef, #8b5cf6, #6366f1); }
        #boot p { color: #c4b5fd; font-size: 14px; margin: 4px 0 0; }
    </style>
</head>
<body>
    <div id="root">
        <div id="boot"><div><div class="mark"></div><strong>Cargando…</strong><p>Filósofo en Formación</p></div></div>
    </div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
