<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        // Evita el parpadeo claro->oscuro al recargar: el tema por defecto es
        // claro (ver :root en src/index.css), esto solo adelanta la eleccion
        // guardada si el usuario paso a oscuro con ThemeToggle.jsx.
        try {
            if (localStorage.getItem('filosofo_theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) { /* localStorage no disponible: queda el tema claro por defecto */ }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6D5AE6">
    <meta name="description" content="Filósofo en Formación: sistema gamificado para clases de Filosofía.">
    <meta name="author" content="Nicolás Aldunate Gaete">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Filósofo en Formación</title>
    <style>
        /* Pantalla de arranque: visible hasta que carga la aplicacion. */
        body { margin: 0; background: #F7F6FB; }
        #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #F7F6FB; color: #1C1A2E;
            font-family: 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
        #boot .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
            background: linear-gradient(135deg, #6D5AE6, #8B7BF0); box-shadow: 0 8px 24px rgba(109, 90, 230, .35); }
        #boot p { color: #6B6880; font-size: 14px; margin: 4px 0 0; }
    </style>
</head>
<body>
    <div id="root">
        <div id="boot"><div><div class="mark"></div><strong>Cargando…</strong><p>Filósofo en Formación</p></div></div>
    </div>
    <noscript>Esta aplicación necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
