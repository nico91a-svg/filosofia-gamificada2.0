    <script>
        // Evita el parpadeo claro->oscuro al recargar: el tema por defecto es
        // claro (ver :root en src/index.css), esto solo adelanta la eleccion
        // guardada si el usuario paso a oscuro con ThemeToggle.jsx.
        try {
            if (localStorage.getItem('filosofo_theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) { /* localStorage no disponible: queda el tema claro por defecto */ }
    </script>
